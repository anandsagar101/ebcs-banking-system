spring:
  datasource:
    url: jdbc:h2:mem:ebcs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-please-change-in-real-environments-this-is-a-long-string-for-hmac
    expiration-ms: 3600000
    issuer: ebcs-backend-test
