spring:
  application:
    name: ebcs-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebcs}
    username: ${DB_USER:ebcs}
    password: ${DB_PASSWORD:ebcs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-256-bits-long-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ebcs-backend
  mfa:
    issuer: ${MFA_ISSUER:EBCS}
  ratelimit:
    auth:
      per-minute: ${RATELIMIT_AUTH_PER_MINUTE:20}
  password-reset:
    ttl-seconds: ${PW_RESET_TTL:300}
    resend-cooldown-seconds: ${PW_RESET_RESEND_COOLDOWN:60}
    max-attempts: ${PW_RESET_MAX_ATTEMPTS:5}
    app-name: ${PW_RESET_APP_NAME:EBCS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

documents:
  storage-path: ${DOC_STORAGE_PATH:/tmp/ebcs-docs}
  max-size-bytes: ${DOC_MAX_SIZE:15728640}
  ocr:
    binary: ${OCR_BINARY:tesseract}
    timeout-seconds: ${OCR_TIMEOUT:60}
    max-chars: ${OCR_MAX_CHARS:20000}

notifications:
  email:
    enabled: ${NOTIFY_EMAIL:true}
  sms:
    enabled: ${NOTIFY_SMS:true}
  push:
    enabled: ${NOTIFY_PUSH:true}

resend:
  api-key: ${RESEND_API_KEY:}
  sender-email: ${RESEND_SENDER_EMAIL:onboarding@resend.dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.ebcs: DEBUG
    org.springframework.security: INFO
